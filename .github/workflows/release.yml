name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require a reviewed commit on main and matching version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          npm run release:check
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: artifacts
      - name: Publish the tested archive using npm OIDC
        run: node scripts/publish.mjs
      - name: Create GitHub release with the same archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs
